<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: brown;
    }
    h1{
        font-size: 36px;
        text-align: center;
        color: white;
    }
    .container{
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
        flex: 1;
        border-radius: 8px;
    }
    .card{
        background-color: white;
        color: black;
        padding: 40px 20px;
        font-size: 20px;
        text-align: center;
        flex: 1;
        border-radius: 8px;
    }
    @media (max-width:768px){
        h1{
            font-size: 24px;
        }
        .container{
            flex-direction: column;
            gap: 15px;
        }
        .card{
            padding: 25px 15px;
            font-size: 16px;
            background-color: blueviolet;
        }
    }
</style>
<body>
    <header>
        <h1>responsive web page</h1>
    </header>
    <div class="container">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
    </div>
</body>
</html>
